<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>todo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d8d8dc;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #3b6fd4;
    --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1f1f24;
      --border: #34343a;
      --text: #ececee;
      --muted: #9a9aa0;
      --accent: #6f9bf0;
      --danger: #e0685c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .navbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .navbar .brand { font-weight: 700; font-size: 1.1rem; margin-right: auto; }
  .view-toggle button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.35rem 0.8rem;
    cursor: pointer;
  }
  .view-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .view-toggle button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .view-toggle button.active { background: var(--accent); color: white; border-color: var(--accent); }
  #add-task-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-weight: 600;
  }
  main { padding: 1.25rem; max-width: 1100px; margin: 0 auto; }
  .view[hidden] { display: none; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  tbody tr:last-child td { border-bottom: none; }
  .empty-state { padding: 2rem; text-align: center; color: var(--muted); }

  .board { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  .column { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; min-height: 200px; }
  .column h2 { margin: 0 0 0.6rem; font-size: 0.9rem; color: var(--muted); }
  .column.drag-over { outline: 2px dashed var(--accent); }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 0.7rem;
    margin-bottom: 0.6rem;
    cursor: grab;
  }
  .card .card-title { font-weight: 600; margin-bottom: 0.25rem; }
  .card .card-meta { font-size: 0.78rem; color: var(--muted); }

  .badge { display: inline-block; border-radius: 4px; padding: 0.1rem 0.45rem; font-size: 0.75rem; }
  .priority-high { color: var(--danger); }
  .priority-medium { color: #b8860b; }
  .priority-low, .priority-none { color: var(--muted); }

  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .backdrop[hidden] { display: none; }
  .modal {
    background: var(--panel);
    border-radius: 10px;
    padding: 1.5rem;
    width: min(480px, 92vw);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .modal[hidden] { display: none; }
  .modal h2 { margin-top: 0; }
  .field { margin-bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-size: 0.8rem; color: var(--muted); }
  .field input, .field textarea, .field select {
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  .field textarea { min-height: 4.5rem; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }
  .modal-actions button { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; background: var(--bg); color: var(--text); }
  .modal-actions button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .modal-actions button.danger { background: none; color: var(--danger); border-color: var(--danger); }
  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; }
  .detail-row { margin-bottom: 0.6rem; }
  .detail-row .label { color: var(--muted); font-size: 0.8rem; }
  .detail-desc { white-space: pre-wrap; margin-top: 1rem; }
</style>
</head>
<body>
  <nav class="navbar">
    <span class="brand">todo</span>
    <div class="view-toggle" role="tablist">
      <button data-view="list" class="active" type="button">List</button>
      <button data-view="board" type="button">Board</button>
    </div>
    <button id="add-task-btn" type="button">+ Add task</button>
  </nav>

  <main>
    <section id="list-view" class="view"></section>
    <section id="board-view" class="view board" hidden>
      <div class="column" data-status="open">
        <h2>Open</h2>
        <div class="cards" data-status="open"></div>
      </div>
      <div class="column" data-status="in-progress">
        <h2>In Progress</h2>
        <div class="cards" data-status="in-progress"></div>
      </div>
      <div class="column" data-status="done">
        <h2>Done</h2>
        <div class="cards" data-status="done"></div>
      </div>
    </section>
  </main>

  <div id="add-backdrop" class="backdrop" hidden>
    <div class="modal">
      <h2>Add task</h2>
      <form id="add-form">
        <div class="field">
          <label for="add-title">Title</label>
          <input id="add-title" name="title" required>
        </div>
        <div class="field">
          <label for="add-description">Description</label>
          <textarea id="add-description" name="description"></textarea>
        </div>
        <div class="field">
          <label for="add-priority">Priority</label>
          <select id="add-priority" name="priority">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="add-due">Due date</label>
          <input id="add-due" name="due_date" type="date">
        </div>
        <div class="error-msg" id="add-error" hidden></div>
        <div class="modal-actions">
          <button type="button" id="add-cancel">Cancel</button>
          <button type="submit" class="primary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <div id="detail-backdrop" class="backdrop" hidden>
    <div class="modal" id="detail-modal"></div>
  </div>

<script src="/app.js"></script>
</body>
</html>
